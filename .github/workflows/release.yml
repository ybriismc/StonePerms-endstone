name: Automated Version Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/endstone_stoneperms/version.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automated-version-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.actor != 'github-actions[bot]' &&
          github.actor != 'dependabot[bot]'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag.outputs.exists }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine

      - name: Verify synchronized versions
        id: version
        run: python .github/scripts/check-version.py

      - name: Check whether tag exists
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${RELEASE_TAG} already exists; publication jobs will be skipped."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stoneperms-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs:
      - validate
    if: needs.validate.outputs.tag_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: stoneperms-${{ needs.validate.outputs.version }}
          path: release-artifacts

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          gh release create "${RELEASE_TAG}" release-artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --generate-notes
